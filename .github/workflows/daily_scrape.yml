name: Daily ACR 2026 Programme Scraper

on:
  schedule:
    # Run every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ACR Scraper (Force Refresh)
        run: |
          python acr_scraper.py --force

      - name: Run Quality Control Validator
        run: |
          python qc_validator.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/acr_2026_programme.xlsx output/acr_2026_programme.json
          git commit -m "Auto-update ACR 2026 Programme Dataset [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload Excel Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acr_2026_programme_excel
          path: output/acr_2026_programme.xlsx
